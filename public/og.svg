      <stop offset="0" stop-color="#0c0c10"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9f6e"/>
      <stop offset="1" stop-color="#14b8a6"/>

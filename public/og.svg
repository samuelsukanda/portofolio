  <text x="80" y="480" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#a1a1ad">Full-stack Developer &mdash; Laravel, React, TypeScript</text>

  <rect x="80" y="520" width="200" height="4" rx="2" fill="url(#accent)"/>
